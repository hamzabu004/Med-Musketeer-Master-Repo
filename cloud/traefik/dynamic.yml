# ZITADEL routes, adapted from ZITADEL's v4.20.0 reference compose (deploy/compose). The Login UI
# serves / and /ui/v2/login; everything else goes to the ZITADEL API over h2c.
http:
  routers:
    zitadel-root:
      rule: Path(`/`)
      entryPoints: [web]
      middlewares: [zitadel-root-rewrite]
      service: zitadel-login
      priority: 400
    zitadel-login:
      rule: PathPrefix(`/ui/v2/login`)
      entryPoints: [web]
      service: zitadel-login
      priority: 250
    zitadel-api:
      rule: PathPrefix(`/`)
      entryPoints: [web]
      service: zitadel-api
      priority: 100

  middlewares:
    zitadel-root-rewrite:
      replacePath:
        path: /ui/v2/login/

  services:
    zitadel-api:
      loadBalancer:
        servers:
          - url: h2c://zitadel-api:8080
    zitadel-login:
      loadBalancer:
        servers:
          - url: http://zitadel-login:3000
