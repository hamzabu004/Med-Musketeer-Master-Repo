# Public routes (compose.public.yaml): HTTPS with Let's Encrypt, one host name per service. The
# hosts come from the proxy's environment. The API's internal and descriptive paths are not routed.
http:
  routers:
    zitadel-root:
      rule: Host(`{{ env "ZITADEL_DOMAIN" }}`) && Path(`/`)
      entryPoints: [websecure]
      middlewares: [zitadel-root-rewrite, limit, secure-headers]
      service: zitadel-login
      priority: 400
      tls: {certResolver: letsencrypt}
    zitadel-login:
      rule: Host(`{{ env "ZITADEL_DOMAIN" }}`) && PathPrefix(`/ui/v2/login`)
      entryPoints: [websecure]
      middlewares: [limit, secure-headers]
      service: zitadel-login
      priority: 250
      tls: {certResolver: letsencrypt}
    zitadel-api:
      rule: Host(`{{ env "ZITADEL_DOMAIN" }}`)
      entryPoints: [websecure]
      middlewares: [limit, secure-headers]
      service: zitadel-api
      priority: 100
      tls: {certResolver: letsencrypt}
    api:
      rule: Host(`{{ env "API_HOST" }}`) && !PathPrefix(`/internal`) && !PathPrefix(`/docs`) && !PathPrefix(`/redoc`) && !Path(`/openapi.json`)
      entryPoints: [websecure]
      middlewares: [limit, secure-headers]
      service: api
      tls: {certResolver: letsencrypt}
    dashboard:
      rule: Host(`{{ env "DASHBOARD_HOST" }}`)
      entryPoints: [websecure]
      middlewares: [limit, secure-headers]
      service: dashboard
      tls: {certResolver: letsencrypt}

  middlewares:
    zitadel-root-rewrite:
      replacePath:
        path: /ui/v2/login/
    # Per client address. A brake on password guessing and floods, not a substitute for ZITADEL's lockout.
    limit:
      rateLimit:
        average: 50
        burst: 100
    secure-headers:
      headers:
        stsSeconds: 31536000
        contentTypeNosniff: true
        referrerPolicy: strict-origin-when-cross-origin

  services:
    zitadel-api:
      loadBalancer:
        servers:
          - url: h2c://zitadel-api:8080
    zitadel-login:
      loadBalancer:
        servers:
          - url: http://zitadel-login:3000
    api:
      loadBalancer:
        servers:
          - url: http://api:8000
    dashboard:
      loadBalancer:
        servers:
          - url: http://dashboard:3000
