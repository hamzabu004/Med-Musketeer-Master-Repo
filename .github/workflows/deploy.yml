name: Deploy

# Deploys main to the public server (cloud/README.md, "Continuous deployment") once every test
# workflow the commit started has passed. Pushes that start none (docs, firmware) do not deploy.
on:
  workflow_run:
    workflows: [Dashboard, Cloud backend]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read

concurrency:
  group: deploy-vm
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Check every test workflow of the commit passed
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            echo "go=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          runs="$(gh run list --repo "$GITHUB_REPOSITORY" --commit "$SHA" --event push --limit 50 \
            --json workflowName,status,conclusion \
            --jq '[.[] | select(.workflowName == "Dashboard" or .workflowName == "Cloud backend")]')"
          echo "$runs" | jq -r '.[] | "\(.workflowName): \(.status) \(.conclusion)"'
          if echo "$runs" | jq -e 'any(.[]; .status == "completed" and .conclusion != "success")' > /dev/null; then
            echo "::error::A test workflow of $SHA did not pass; not deploying."; exit 1
          fi
          if echo "$runs" | jq -e 'any(.[]; .status != "completed")' > /dev/null; then
            echo "Another test workflow of $SHA is still running; it deploys when it passes."
            echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "go=true" >> "$GITHUB_OUTPUT"

      - name: Deploy over SSH
        if: steps.gate.outputs.go == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          SHA: ${{ steps.gate.outputs.sha }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The key's forced command (deploy.sh) takes the SHA as the SSH command.
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 "opc@$DEPLOY_HOST" "$SHA"
